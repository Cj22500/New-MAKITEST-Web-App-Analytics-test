{% extends "base.html" %}
{% block main_class %}narrow{% endblock %}
{% block content %}
<h1>Create your account</h1>
<p class="sub">Choose your role and enter your account details.</p>
<div class="card">
<form method="post" novalidate>
{% csrf_token %}
{% include "form_fields.html" %}
<button class="primary">Create account</button>
</form>
</div>
<p class="foot">Already have an account? <a href="{% url "login" %}">Log in</a>
</p>
{% endblock %}
