{% if form.non_field_errors %}
<div class="notice error" role="alert">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
<div class="field">
<label for="{{ field.id_for_label }}">{{ field.label|title }}{% if field.field.required %} <span class="muted">(Required)</span>
{% endif %}
</label>{{ field }}{% if field.help_text %}
<div class="help" id="{{ field.id_for_label }}_helptext">{{ field.help_text|safe }}</div>
{% endif %}{{ field.errors }}</div>
{% endfor %}
