name: CI Quality Gate

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  django-quality-check:
    name: Django Checks, Static Files & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies (OpenCV & MediaPipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender1 \
            ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Django System Check
        run: |
          cd whatever
          python manage.py check

      - name: Verify Static Files Collection (WhiteNoise)
        run: |
          cd whatever
          python manage.py collectstatic --noinput --dry-run

      - name: Run Django Database Migrations Check
        run: |
          cd whatever
          python manage.py migrate --noinput

      - name: Run Django Unit Tests
        run: |
          cd whatever
          python manage.py test teacherside adminside homepage
